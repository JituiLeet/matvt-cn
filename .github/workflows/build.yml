name: Build MATVT Chinese

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;30.0.3"

      - name: Remove local Java path from Gradle configuration
        run: |
          find . -name gradle.properties -type f \
            -exec sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' {} +

          if [ -f "$HOME/.gradle/gradle.properties" ]; then
            sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' "$HOME/.gradle/gradle.properties"
          fi

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MATVT-Chinese-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
